<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Fabric Shared Summary</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="clinic.css?v=7" />
  <style>
    .free-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--accent-1); }
    .free-bar .brand { padding: 0; }
    .free-main { max-width: 1160px; margin: 0 auto; padding: 32px 32px 120px; }
    .free-main .top { margin-bottom: 20px; }
    .free-actions { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 12px;
      padding: 16px 32px; background: rgba(255, 249, 244, 0.94); backdrop-filter: blur(6px); border-top: 1px solid var(--accent-1); }
    .free-actions .actions__note { margin-right: auto; }
    .empty-state { max-width: 520px; margin: 80px auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    @media (max-width: 860px) { .free-bar, .free-main, .free-actions { padding-left: 16px; padding-right: 16px; } .free-actions { flex-wrap: wrap; } }
    @media print { .free-bar, .free-actions { display: none !important; } .free-main { padding: 0; } }
  </style>
</head>
<body>
  <header class="free-bar">
    <div class="brand">
      <img src="assets/logo.png" width="28" height="28" alt="" />
      <span class="h-m">Fabric</span>
      <span class="brand__tag label">Free clinic view</span>
    </div>
    <p class="small muted">No account or software needed. Works at any clinic.</p>
  </header>

  <main class="free-main" id="main"></main>

  <div class="free-actions" id="free-actions" hidden>
    <p class="small muted actions__note">Re-typing this? <a class="link" href="clinic.html">Fabric for Clinics</a> imports it for you.</p>
    <button class="btn btn--light" type="button" id="ccda">Download C-CDA (.xml)</button>
    <button class="btn btn--primary" type="button" id="print">Download PDF for your chart</button>
  </div>

  <script src="config.js?v=7"></script>
  <script src="shared.js?v=7"></script>
  <script src="api.js?v=7"></script>
  <script src="packet.js?v=7"></script>
  <script src="export.js?v=7"></script>
  <script>
    (function () {
      var main = document.getElementById("main");
      function empty(title, text) {
        main.innerHTML = '<div class="empty-state"><p class="h-m">' + title + '</p><p class="body muted">' + text + "</p></div>";
      }
      main.innerHTML = '<div class="empty-state"><p class="body muted">Loading…</p></div>';
      window.FabricApi.ready.then(function () {
        return window.FabricApi.sharedSummary(new URLSearchParams(location.search));
      }).then(function (r) {
        if (!r.ok) {
          return r.reason === "expired"
            ? empty("This link has expired", "Links last 24 hours, or until the patient ends them. Ask them to share again.")
            : empty("This link isn’t valid", "Ask the patient to share again from their Fabric app.");
        }
        window.FabricData.load(r.data);
        main.innerHTML =
          '<header class="top"><div><p class="body muted">Shared health summary</p><h1 class="h-xl">Patient-approved records</h1></div></header>' +
          window.FabricPacket.render({ keys: r.keys, pro: false, sharedAt: r.sharedAt, expires: r.expires });
        document.getElementById("free-actions").hidden = false;
        document.getElementById("print").addEventListener("click", function () { window.print(); });
        document.getElementById("ccda").addEventListener("click", function () {
          window.FabricExport.download(window.FabricExport.fileBase() + ".ccda.xml", window.FabricExport.ccda(r.keys), "application/xml");
        });
      }).catch(function (err) { empty("Couldn’t load this summary", err.message); });
    })();
  </script>
</body>
</html>
